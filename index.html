<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Denník potravín</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: steel-and-chalk gym log. A scoreboard summary rail (left on desktop) beside a ruled meal ledger;
   Olympic plate colours code the macros (red = bielkoviny, blue = sacharidy, yellow = tuky). */
:root {
  --bg: #ECEEF1;
  --surface: #FFFFFF;
  --surface-2: #F4F5F7;
  --ink: #15181D;
  --on-ink: #FFFFFF;
  --muted: #5A626D;
  --line: #D5D9DF;
  --protein: #C8102E;
  --carbs: #1D4FA6;
  --fat: #D49A00;
  --water: #0B86AE;
  --ok: #1D7A49;
  --warn: #B5420B;
  --focus: #1D4FA6;
  --scrim: rgba(12, 14, 18, .45);
  --shadow: 0 12px 40px rgba(12, 14, 18, .22);
  --board: #15181D;
  --board-ink: #F2F4F6;
  --board-muted: #9AA3AE;
  --board-line: #2C323B;
  --board-track: #2A3038;
  --b-protein: #F2475E;
  --b-carbs: #4D8EF2;
  --b-fat: #F4BC2C;
  --b-ok: #44C285;
  --b-warn: #F28A4A;
  --font-display: "Big Shoulders Display", "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1013; --surface: #171A1F; --surface-2: #1E2228; --ink: #E8EBEF; --on-ink: #0E1013;
    --muted: #97A0AC; --line: #2A2F37; --protein: #F2475E; --carbs: #5B97F5; --fat: #F4BC2C; --water: #3CB9E2;
    --ok: #44C285; --warn: #F28A4A; --focus: #5B97F5; --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 12px 40px rgba(0, 0, 0, .5); --board: #1C2026; --board-line: #2F353E; --board-track: #2C323B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1013; --surface: #171A1F; --surface-2: #1E2228; --ink: #E8EBEF; --on-ink: #0E1013;
  --muted: #97A0AC; --line: #2A2F37; --protein: #F2475E; --carbs: #5B97F5; --fat: #F4BC2C; --water: #3CB9E2;
  --ok: #44C285; --warn: #F28A4A; --focus: #5B97F5; --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 12px 40px rgba(0, 0, 0, .5); --board: #1C2026; --board-line: #2F353E; --board-track: #2C323B;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
.locked body { overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.app { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 8px 128px; }

/* Top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800;
  font-size: 1.45rem; letter-spacing: .03em; text-transform: uppercase; line-height: 1; }
.plate { width: 26px; height: 26px; flex: none; }
.plate .rim { fill: var(--protein); }
.plate .hub { fill: var(--bg); }
.plate .ring { fill: none; stroke: var(--bg); stroke-width: 1.2; opacity: .55; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; min-height: 40px; padding: 0 14px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500;
  text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); font-weight: 600; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--warn); }
.btn.block { width: 100%; min-height: 48px; }
.btn.small { min-height: 34px; padding: 0 12px; font-size: .9rem; }
.icon-btn { width: 40px; padding: 0; }
.btn.small.icon-btn { width: 34px; }
.btn svg { width: 18px; height: 18px; flex: none; }
.linklike { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

/* Day bar */
.daybar { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 20px;
  padding-block: 18px 16px; border-bottom: 3px solid var(--ink); margin-bottom: 20px; }
.day-title { min-width: 0; }
.day-title h1 { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; margin: 0;
  font-size: clamp(2.4rem, 9vw, 3.6rem); line-height: .88; letter-spacing: .01em; text-wrap: balance; }
.day-title p { margin: 6px 0 0; color: var(--muted); }
.daynav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.date-input { font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; min-height: 40px; padding: 0 10px; }

/* Layout */
.layout { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 880px) {
  .layout { grid-template-columns: minmax(0, 370px) minmax(0, 1fr); align-items: start; }
}
.rail { display: grid; gap: 20px; min-width: 0; }
.main-col { min-width: 0; }
/* Na mobile ide denník hneď pod súhrn, voda a týždeň až za ním. */
@media (max-width: 879px) {
  .rail { display: contents; }
  #summary { order: 1; } .main-col { order: 2; } #water { order: 3; } #week { order: 4; }
}

/* Scoreboard */
.board { background: var(--board); color: var(--board-ink); border: 1px solid var(--board-line); border-radius: 14px; padding: 20px; }
.eyebrow { font-size: .72rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }
.board .eyebrow { color: var(--board-muted); }
.board-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.streak { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; color: var(--board-ink);
  border: 1px solid var(--board-line); border-radius: 999px; padding: 2px 10px 2px 8px; font-variant-numeric: tabular-nums; }
.streak svg { width: 14px; height: 14px; fill: var(--b-warn); }
.kcal-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
.kcal-big { font-family: var(--font-display); font-weight: 800; font-size: clamp(3.4rem, 15vw, 4.6rem); line-height: .82;
  font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.kcal-big small { font-size: .32em; font-weight: 700; letter-spacing: .06em; margin-left: .25em; color: var(--board-muted); }
.kj { color: var(--board-muted); font-size: .85rem; font-variant-numeric: tabular-nums; margin-bottom: 2px; }
.kbar { position: relative; height: 14px; border-radius: 3px; background: var(--board-track); margin-top: 16px; overflow: hidden; }
.kbar-fill { position: absolute; inset: 0 auto 0 0; background: var(--b-ok); transition: width .35s ease; }
.kbar-over { position: absolute; top: 0; bottom: 0; background: var(--b-warn); }
.kbar .tick { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--board); opacity: .7; }
.kbar .goal-mark { position: absolute; top: -2px; bottom: -2px; width: 3px; margin-left: -1.5px; background: var(--board-ink); }
.formula { display: flex; align-items: flex-end; justify-content: space-between; gap: 4px; margin-top: 14px; font-variant-numeric: tabular-nums; }
.formula div { display: grid; min-width: 0; text-align: center; }
.formula b { font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; line-height: 1; }
.formula span { font-size: .7rem; color: var(--board-muted); letter-spacing: .06em; text-transform: uppercase; margin-top: 3px; }
.formula i { font-style: normal; color: var(--board-muted); font-size: 1.1rem; padding-bottom: 16px; }
.formula .rem b { color: var(--b-ok); font-size: 1.75rem; }
.formula .rem.over b { color: var(--b-warn); }
.macros { display: grid; gap: 14px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--board-line); }
.macro-top { display: flex; align-items: baseline; gap: 8px; }
.macro-name { flex: 1; min-width: 0; }
.macro-val { font-variant-numeric: tabular-nums; color: var(--board-muted); }
.macro-val b { color: var(--board-ink); font-weight: 600; }
.sw { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }
.sw-p { background: var(--protein); } .sw-c { background: var(--carbs); } .sw-f { background: var(--fat); }
.board .sw-p, .b-p { background: var(--b-protein); }
.board .sw-c, .b-c { background: var(--b-carbs); }
.board .sw-f, .b-f { background: var(--b-fat); }
.mbar { height: 8px; border-radius: 2px; background: var(--board-track); margin-top: 6px; overflow: hidden; }
.mbar span { display: block; height: 100%; transition: width .35s ease; }
.split-wrap { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--board-line); }
.split { display: flex; height: 10px; border-radius: 2px; overflow: hidden; background: var(--board-track); margin-top: 8px; gap: 2px; }
.split span { display: block; height: 100%; }
.split-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: .82rem; color: var(--board-muted);
  font-variant-numeric: tabular-nums; }
.split-legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Panels: water, week */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0; }
.panel h2 { margin: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.water-val { font-variant-numeric: tabular-nums; color: var(--muted); }
.water-val b { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; color: var(--ink); }
.glasses { display: grid; grid-template-columns: repeat(auto-fill, minmax(26px, 1fr)); gap: 4px; margin-top: 12px; }
.glass { background: none; border: 0; padding: 4px 0; cursor: pointer; border-radius: 6px; display: grid; place-items: center; }
.glass:hover { background: var(--surface-2); }
.glass svg { width: 22px; height: 28px; }
.glass .g-out { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-linejoin: round; }
.glass .g-fill { fill: var(--water); opacity: 0; transition: opacity .2s; }
.glass.on .g-out { stroke: var(--water); }
.glass.on .g-fill { opacity: 1; }
.water-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

.wc { margin-top: 14px; }
.wc-plot { position: relative; height: 128px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-bottom: 2px solid var(--ink); }
.wc-col { position: relative; height: 100%; background: none; border: 0; padding: 0; cursor: pointer; border-radius: 4px 4px 0 0; }
.wc-col:hover { background: var(--surface-2); }
.wc-bar { position: absolute; bottom: 0; left: 22%; right: 22%; background: var(--muted); border-radius: 2px 2px 0 0; transition: height .35s ease; }
.wc-col.over .wc-bar { background: var(--warn); }
.wc-col.sel .wc-bar { background: var(--ink); }
.wc-col.sel.over .wc-bar { background: var(--warn); outline: 2px solid var(--ink); outline-offset: 1px; }
.wc-val { position: absolute; left: 0; right: 0; text-align: center; font-size: .68rem; color: var(--muted);
  font-variant-numeric: tabular-nums; white-space: nowrap; transform: translateY(-3px); }
.wc-col.sel .wc-val { color: var(--ink); font-weight: 600; }
.wc-goal { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--protein); pointer-events: none; z-index: 1; }
.wc-goal span { position: absolute; left: 0; bottom: 2px; font-size: .66rem; color: var(--protein); font-weight: 600;
  background: var(--surface); padding: 0 3px; letter-spacing: .04em; text-transform: uppercase; }
.wc-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); margin-top: 6px; text-align: center; font-size: .78rem; color: var(--muted); }
.wc-days .sel { color: var(--ink); font-weight: 600; }
.wc-days .today { text-decoration: underline; text-underline-offset: 3px; }
.week-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.stat b { display: block; font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: .82rem; }

/* Ledger */
.ledger { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.empty-day { padding: 18px 16px 16px; border-bottom: 1px solid var(--line); }
.empty-day p { margin: 0 0 10px; max-width: 58ch; }
.empty-day .btn { margin-bottom: 12px; }
.meal { padding: 16px 16px 14px; }
.meal + .meal { border-top: 1px solid var(--line); }
.meal.acts { border-top: 3px solid var(--ink); }
.meal-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.meal-head h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; line-height: 1; letter-spacing: .04em;
  text-transform: uppercase; margin: 0; }
.meal-sum { display: flex; align-items: baseline; gap: 12px; font-variant-numeric: tabular-nums; }
.meal-sum .kc { font-weight: 600; }
.meal-sum .mm { color: var(--muted); font-size: .82rem; }
.burn { color: var(--ok); }
.items { list-style: none; margin: 10px 0 0; padding: 0; }
.item-btn { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 14px; width: 100%; text-align: left;
  background: none; border: 0; border-top: 1px dashed var(--line); padding: 9px 4px; cursor: pointer; border-radius: 0; }
.item-btn:hover { background: var(--surface-2); }
.item-name { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.item-kcal { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
.item-sub { grid-column: 1 / -1; color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; }
.meal-empty { margin: 8px 0 0; color: var(--muted); font-size: .9rem; }
.meal-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

.foot { margin-top: 20px; color: var(--muted); font-size: .85rem; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; margin-right: 6px; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); }

/* Floating buttons */
.desk-only { display: none; }
.fabs { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: flex; gap: 10px; align-items: center; }
.fab { min-height: 54px; padding: 0 22px; border-radius: 999px; box-shadow: var(--shadow); font-size: 1rem; }
.fab-mic { width: 54px; height: 54px; padding: 0; border-radius: 50%; box-shadow: var(--shadow); }
.fab-mic svg { width: 24px; height: 24px; }
@media (min-width: 880px) { .desk-only { display: inline-flex; } .fabs { display: none; } }

/* Sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.sheet { position: relative; width: 100%; max-width: 560px; max-height: 90vh; max-height: 90dvh; overflow: auto;
  overscroll-behavior: contain; background: var(--surface); border-radius: 16px 16px 0 0; box-shadow: var(--shadow);
  padding: 0 16px calc(22px + env(safe-area-inset-bottom, 0px)); animation: sheet-up .2s ease-out; }
@media (min-width: 700px) {
  .sheet-wrap { align-items: center; padding: 24px; }
  .sheet { border-radius: 16px; max-height: 86vh; }
}
@keyframes sheet-up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet-head { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; align-items: center; gap: 8px;
  padding-block: 14px 10px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.sheet-head h2 { flex: 1; min-width: 0; margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.6rem;
  line-height: 1; text-transform: uppercase; letter-spacing: .03em; overflow-wrap: anywhere; }
.sheet h3 { font-size: .72rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; }
.sheet-section + .sheet-section { margin-top: 16px; }
.lbl { display: block; font-size: .85rem; font-weight: 500; margin-bottom: 6px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; min-height: 34px;
  cursor: pointer; font-size: .9rem; font-variant-numeric: tabular-nums; }
.chip:hover { border-color: var(--muted); }
.chip[aria-checked="true"], .chip[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }

.tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; margin-top: 14px; }
.tab { border: 0; background: none; border-radius: 8px; min-height: 38px; cursor: pointer; font-size: .88rem; font-weight: 500; padding: 0 6px; }
.tab[aria-selected="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); font-weight: 600; }

.field { font: inherit; font-size: 16px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px 12px; width: 100%; min-height: 46px; }
.field:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
select.field { padding-right: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.hint { color: var(--muted); font-size: .85rem; margin: 8px 0 0; }
.hint.warn { color: var(--warn); }
.err { color: var(--warn); font-size: .88rem; font-weight: 500; margin: 8px 0 0; }
.check { display: flex; align-items: flex-start; gap: 10px; margin-top: 14px; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--ink); flex: none; }

.search-wrap { position: relative; }
.search-wrap .field { padding-right: 52px; }
.search-wrap .btn { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); }
.results { margin-top: 6px; }
.res-group h3 { margin-top: 18px; }
.food-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 12px; width: 100%; text-align: left; background: none;
  border: 0; border-bottom: 1px solid var(--line); padding: 10px 4px; cursor: pointer; }
.food-row:hover { background: var(--surface-2); }
.fr-name { font-weight: 500; overflow-wrap: anywhere; }
.fr-kcal { font-variant-numeric: tabular-nums; font-weight: 600; }
.fr-meta { grid-column: 1 / -1; color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
.badge { display: inline-block; font-size: .66rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 6px; color: var(--muted); vertical-align: 2px; }
.no-res { color: var(--muted); padding: 14px 2px; }

.amount-row { display: flex; align-items: center; gap: 10px; }
.amount-row .field { font-family: var(--font-display); font-weight: 700; font-size: 2rem; max-width: 170px; padding: 4px 12px; font-variant-numeric: tabular-nums; }
.amount-row .unit { font-weight: 600; color: var(--muted); }
.preview { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 10px 16px;
  margin: 16px 0; padding: 14px 16px; border-radius: 10px; background: var(--surface-2); }
.pv-kcal { font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; line-height: .85; font-variant-numeric: tabular-nums; }
.pv-kcal small { font-size: .4em; color: var(--muted); letter-spacing: .06em; margin-left: .2em; }
.pv-macros { display: flex; gap: 14px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.pv-macros span { display: inline-flex; align-items: center; gap: 6px; }
.per100 { color: var(--muted); font-size: .82rem; margin: 0 0 16px; font-variant-numeric: tabular-nums; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 160px; }

/* Voice */
.voice { display: grid; justify-items: center; gap: 10px; padding-block: 8px 16px; text-align: center; }
.mic { width: 84px; height: 84px; border-radius: 50%; border: 0; background: var(--ink); color: var(--on-ink); cursor: pointer;
  display: grid; place-items: center; position: relative; }
.mic svg { width: 34px; height: 34px; }
.mic.live { background: var(--protein); color: #FFFFFF; }
.mic.live::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 3px solid var(--protein); animation: ring 1.2s ease-out infinite; }
@keyframes ring { from { transform: scale(.9); opacity: .9; } to { transform: scale(1.25); opacity: 0; } }
.mic-status { margin: 0; color: var(--muted); max-width: 40ch; }
.mic-status b { color: var(--ink); }
.kbd-mic { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border: 1px solid var(--line);
  border-radius: 5px; vertical-align: -5px; background: var(--surface-2); }
.kbd-mic svg { width: 13px; height: 13px; }
textarea.voice-text { min-height: 96px; resize: vertical; line-height: 1.45; }
.examples { display: grid; gap: 6px; margin-top: 10px; }
.example { text-align: left; background: var(--surface-2); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px;
  cursor: pointer; font-size: .88rem; color: var(--muted); }
.example:hover { color: var(--ink); border-color: var(--muted); }
.vr-list { list-style: none; margin: 12px 0 0; padding: 0; }
.vr { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.vr input[type=checkbox] { width: 20px; height: 20px; margin: 12px 0 0; accent-color: var(--ink); }
.vr.off .vr-body { opacity: .45; }
.vr-body { display: grid; gap: 6px; min-width: 0; }
.vr-name { font-weight: 600; overflow-wrap: anywhere; padding-top: 10px; }
.vr-sub { color: var(--muted); font-size: .8rem; }
.vr-sub .est { color: var(--warn); }
.vr-ctrl { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.vr-ctrl .field { min-height: 40px; padding: 6px 10px; }
.vr-g-wrap { position: relative; }
.vr-g-wrap .field { padding-right: 26px; font-variant-numeric: tabular-nums; }
.vr-g-wrap span { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: .85rem; pointer-events: none; }
.vr-kcal { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.unmatched { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); }
.unmatched p { margin: 0 0 6px; font-size: .88rem; }
.unmatched ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.unmatched li { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.voice-total { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 14px 0 10px; font-variant-numeric: tabular-nums; }
.voice-total b { font-family: var(--font-display); font-size: 1.6rem; }
.busy { display: inline-flex; align-items: center; gap: 8px; }
.busy::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--ink); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.my-foods { list-style: none; padding: 0; margin: 0; }
.my-foods li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.my-foods .mf-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.my-foods .mf-meta { display: block; color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
textarea.field.mono { min-height: 140px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
.file-label { position: relative; overflow: hidden; }
.file-label input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* Toast */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  display: flex; align-items: center; gap: 14px; max-width: calc(100vw - 32px); width: max-content;
  background: var(--ink); color: var(--on-ink); border-radius: 10px; padding: 10px 12px 10px 16px; box-shadow: var(--shadow); }
.toast span { min-width: 0; }
.toast-act { background: none; border: 1px solid currentColor; color: inherit; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-weight: 600; flex: none; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

  Cloud.col.onSnapshot(applySnapshot, err => {

    toast('Spojenie s úložiskom sa prerušilo. Obnov stránku.');

}

const isPending = id => { const q = Cloud.queue[id]; return !!(q && (q.busy || q.next !== undefined)); };

function applySnapshot(snap) {
  const days = {};
  let goals = null, foods = null;
  for (const doc of snap.docs) {
    const v = doc.data();
    if (!v) continue;
    if (doc.id === 'settings') goals = v.goals;
    else if (doc.id === 'foods') foods = v.list;
    else if (doc.id.startsWith('d') && isDayKey(v.date)) { const day = cleanDay(v); if (day) days[v.date] = day; }
  }
  // Dokumenty s ešte neodoslaným zápisom nechávame tak, ako ich má stránka.
  for (const k of Object.keys(days)) if (isPending('d' + k)) delete days[k];
  for (const [k, v] of Object.entries(S.days)) if (isPending('d' + k)) days[k] = v;
  S.days = days;
  if (!isPending('settings')) S.goals = normalizeGoals(goals);
  if (!isPending('foods')) S.foods = (Array.isArray(foods) ? foods : []).map(cleanFood).filter(Boolean);
  render();
  if (UI.sheet && UI.sheet.view === 'settings') renderMyFoods();
}

function cloudWrite(id, data) {
  const q = Cloud.queue[id] || (Cloud.queue[id] = { busy: false, next: undefined, waiters: [] });
  q.next = data === DEL ? DEL : clone(data);
  const done = new Promise(r => q.waiters.push(r));
  if (!q.busy) flushQueue(id, q);
  return done;
}

async function flushQueue(id, q) {
  q.busy = true;
  while (q.next !== undefined) {
    const data = q.next;
    q.next = undefined;
    const waiters = q.waiters.splice(0);
    const ref = Cloud.col.doc(id);
    const run = () => (data === DEL ? ref.delete() : ref.set(data));
    let failed = null;
    try { await run(); }
    catch (e) {
      if (e && e.code === 'unavailable') {
        await sleep(400 + Math.random() * 800);
        try { await run(); } catch (e2) { failed = e2; }
      } else failed = e;
    }
    if (failed) reportWriteError(failed);
    waiters.forEach(r => r());
  }
  q.busy = false;
}

function reportWriteError(e) {
  const code = e && e.code;
  const msg = code === 'invalid_argument' ? 'Zmena sa neuložila: k tejto stránke máš prístup len na čítanie.'
    : code === 'quota_exceeded' ? 'Úložisko je plné. Exportuj zálohu a vymaž staré záznamy.'
    : code === 'resource_exhausted' ? 'Príliš veľa zmien naraz. Skús to o chvíľu znova.'
    : 'Zmena sa neuložila. Skontroluj pripojenie a skús to znova.';
  toast(msg);
  if (Cloud.col) Cloud.col.get().then(applySnapshot).catch(() => {});
}

const STOP_WORDS = new Set(('som si sa sme ste mal mala malo mali jedol jedla jedli zjedol zjedla zjedli vypil vypila vypili pil pila ' +

const SUFFIXES = ['iami', 'ami', 'ach', 'ich', 'ych', 'ymi', 'ovi', 'och', 'ov', 'om', 'ou', 'ej', 'ia', 'ie', 'iu', 'ii', 'mi', 'a', 'e', 'i', 'o', 'u', 'y'];

function stem(w) {
  for (const s of SUFFIXES) if (w.length - s.length >= 3 && w.endsWith(s)) return w.slice(0, -s.length);
  return w;
}
function stemMatch(a, b) {
  if (a === b) return true;
  let i = 0;
  while (i < a.length && i < b.length && a[i] === b[i]) i++;
  return i >= 4 && i >= Math.min(a.length, b.length) - 1;
}
const wordList = s => norm(s).split(/[^a-z0-9]+/).filter(w => w.length >= 2 && !/\d/.test(w) && !STOP_WORDS.has(w) && w !== 'bez' && w !== 's');

const termCache = new WeakMap();
function termsOf(f) {
  let t = termCache.get(f);
  if (t) return t;
  const n = f.name;
  const paren = (n.match(/\(([^)]*)\)/g) || []).join(' ');
  t = {
    req: wordList(n.replace(/\([^)]*\)/g, ' ')).map(stem),
    opt: wordList(paren).map(stem),
    alts: (ALIASES[f.id] || []).map(a => wordList(a).map(stem)),
  };
  termCache.set(f, t);
  return t;
}

function rankFoods(q) {
  const res = [];
  for (const f of [...S.foods, ...FOODS]) {
    const T = termsOf(f);
    let best = 0;
    for (const terms of [T.req, ...T.alts]) {
      if (!terms.length) continue;
      const m = terms.filter(t => q.some(s => stemMatch(s, t))).length;
      if (m) best = Math.max(best, m * 2 + (m / terms.length) * 3);
    }
    if (!best) continue;
    best += T.opt.filter(t => q.some(s => stemMatch(s, t))).length * 1.5;
    if (VOICE_PREF.has(f.id)) best += 0.4;
    if (f.custom) best += 0.3;
    res.push({ food: f, score: best });
  }
  return res.sort((a, b) => b.score - a.score);
}

function mealOf(n) {
  if (/^ranaj/.test(n) || n === 'rano') return 'ranajky';
  if (/^desiat(a|u|ou|e|y)?$/.test(n)) return 'desiata';
  if (/^obed/.test(n)) return 'obed';
  if (/^olovrant/.test(n)) return 'olovrant';
  if (/^vecer/.test(n)) return 'vecera';
  return null;
}

function amountFor(p, food) {
  const fu = food && food.unit, n = p.qty, u = p.unit;
  if (u && u.mul) return { g: r1((n ?? 1) * u.mul), est: false };
  if (u) {
    const same = !!fu && (u.generic || u.re.test(norm(fu.name)));
    const per = same ? fu.g : (u.g || (fu ? fu.g : 100));
    return { g: r1((n ?? 1) * per), est: !same };
  }
  if (n != null) {
    if (n > 20) return { g: r1(n), est: false };
    if (fu) return { g: r1(n * fu.g), est: false };
    return { g: r1(n * 100), est: true };
  }
  return { g: fu ? fu.g : 100, est: true };
}

// Rozloží vetu typu „na raňajky dve vajcia a krajec chleba, na obed 150 g ryže“ na položky.
function parseLocal(text, defMeal) {
  let t = ' ' + String(text).toLowerCase() + ' ';
  t = t.replace(/(\d)[.,](\d)/g, '$1·$2')
    .replace(/(\d)([^\d\s·.,;:!?%·-])/g, '$1 $2')
    .replace(/\s+a\s+pol\b/g, ' apol');
  const segs = [];
  for (const part of t.split(/[,;.!?\n]+|\s[-–]\s/)) {
    let cur = [];
    for (const w of part.split(/\s+/)) {
      const o = w.replace(/·/g, ',').replace(/^["„“'(]+|["„“')]+$/g, '');
      const n = norm(w).replace(/·/g, '.').replace(/[^a-z0-9.]/g, '');
      if (!n) continue;
      if (SEP_WORDS.has(n)) { if (cur.length) segs.push(cur); cur = []; continue; }
      cur.push({ o, n });
    }
    if (cur.length) segs.push(cur);
  }
  const parsed = segs.map(seg => {
    let meal = null, qty = null, unit = null;
    const food = [];
    for (let i = 0; i < seg.length; i++) {
      const n = seg[i].n;
      if (n === 'bez') { i++; continue; }
      if (/^druh(a|u|ej|ou)$/.test(n) && seg[i + 1] && /^vecer/.test(seg[i + 1].n)) { meal = 'vecera2'; i++; continue; }
      if (n === 'noc' || n === 'spanim') { meal = 'vecera2'; continue; }
      const m = mealOf(n);
      if (m) { meal = m; continue; }
      if (/^\d+(\.\d+)?$/.test(n)) { qty = (qty || 0) + parseFloat(n); continue; }
      if (n === 'apol') { qty = (qty ?? 1) + 0.5; continue; }
      if (Object.prototype.hasOwnProperty.call(NUM_WORDS, n)) { qty = (qty || 0) + NUM_WORDS[n]; continue; }
      const u = !unit && UNIT_WORDS.find(x => x.re.test(n));
      if (u) { unit = u; continue; }
      if (STOP_WORDS.has(n) || n.length < 2) continue;
      food.push(seg[i]);
    }
    return { meal, qty, unit, food, orig: seg.map(x => x.o).join(' ') };
  });
  const firstMeal = (parsed.find(p => p.meal) || {}).meal || null;
  let last = null;
  for (const p of parsed) { if (p.meal) last = p.meal; p.mealFinal = p.meal || last || firstMeal || defMeal; }

  const out = { items: [], water: 0, unmatched: [] };
  for (const p of parsed) {
    if (!p.food.length) continue;
    const q = p.food.map(x => stem(x.n));
    if (q.some(s => WATER_STEMS.has(s))) { out.water += amountFor(p, { unit: { name: 'pohár', g: GLASS } }).g; continue; }
    const ranked = rankFoods(q);
    if (!ranked.length || ranked[0].score < 3.5) { out.unmatched.push(p.orig); continue; }
    const food = ranked[0].food;
    const { g, est } = amountFor(p, food);
    out.items.push({ text: p.orig, food, alts: ranked.slice(0, 6).map(r => r.food), g, est, meal: p.mealFinal, on: true });
  }
  return out;
}

function catalogText() {
  return [...S.foods, ...FOODS].map(f => `${f.id}|${f.name}|${f.kcal},${f.p},${f.c},${f.f}|${f.unit ? f.unit.name + ' ' + f.unit.g + ' g' : ''}`).join('\n');
}

async function parseWithClaude(text, defMeal, signal) {
  const prompt = `Si asistent kalorickej aplikácie (ako MyFitnessPal alebo Kalorické tabuľky). Používateľ po slovensky nadiktoval, čo zjedol alebo vypil. Text môže obsahovať chyby rozpoznávania reči.

Rozlož text na jednotlivé potraviny a nápoje. Pre každú vráť objekt:
- "text": úsek pôvodného textu, ktorého sa položka týka,
- "fid": id z katalógu nižšie, ak potravina zodpovedá položke katalógu; inak null,
- "name": krátky slovenský názov potraviny (vždy),
- "grams": množstvo v gramoch (ml ber ako gramy); kusy, krajce, lyžice a porcie prepočítaj podľa katalógu alebo bežnej veľkosti,
- "estimated": true, ak množstvo v texte nezaznelo a odhadol si ho,
- "meal": jedno z ranajky, desiata, obed, olovrant, vecera, vecera2 (druhá večera), alebo null, ak jedlo dňa nezaznelo,
- "per100": {"kcal": číslo, "p": číslo, "c": číslo, "f": číslo} na 100 g (bielkoviny, sacharidy, tuky v gramoch); vyplň iba keď fid je null, podľa bežných slovenských nutričných tabuliek.
Čistú vodu (aj minerálku) nedávaj medzi položky; jej celkové množstvo v ml daj do "water_ml".
Odpovedz iba JSON objektom v tvare {"items": [...], "water_ml": 0}.

Katalóg (id|názov|kcal,bielkoviny,sacharidy,tuky na 100 g|bežná porcia):
${catalogText()}

Text používateľa:
"""${text.slice(0, 2000)}"""`;
  const res = await UI.sample.json(prompt, { modelTier: 'quick', signal });
  const out = { items: [], water: 0, unmatched: [] };
  const list = res && Array.isArray(res.items) ? res.items : [];
  for (const x of list.slice(0, 30)) {
    if (!x || typeof x !== 'object') continue;
    const g = num(x.grams);
    const meal = MEAL_NAME[x.meal] ? x.meal : defMeal;
    let food = typeof x.fid === 'string' ? findFood(x.fid) : null;
    if (!food) {
      const per = cleanPer(x.per100);
      const name = String(x.name || x.text || '').trim().slice(0, 80);
      if (!per || !name || per.kcal > 950 || per.p > 100 || per.c > 100 || per.f > 100) { if (x.text || x.name) out.unmatched.push(String(x.text || x.name).slice(0, 80)); continue; }
      food = { id: 'ai:' + uid(), name, ...per, unit: null, adhoc: true, ai: true };
    }
    const local = rankFoods(wordList(String(x.text || x.name || '')).map(stem)).slice(0, 5).map(r => r.food);
    const alts = [food, ...local.filter(f => f.id !== food.id)];
    out.items.push({ text: String(x.text || x.name || '').slice(0, 80), food, alts, g: g > 0 && g <= 5000 ? r1(g) : (food.unit ? food.unit.g : 100), est: !!x.estimated || !(g > 0), meal, on: true });
  }
  const w = num(res && res.water_ml);
  if (w > 0 && w <= 10000) out.water = Math.round(w);
  return out;
}

      <div class="kcal-big">${fk(t.kcal)}<small>kcal</small></div>

      <div class="kbar-fill" style="width:${fillPct.toFixed(2)}%"></div>
      ${overPct ? `<div class="kbar-over" style="left:${goalPct.toFixed(2)}%;width:${overPct.toFixed(2)}%"></div>` : ''}

      <div><b>${fk(g.kcal)}</b><span>cieľ</span></div><i>−</i>
      <div><b>${fk(t.kcal)}</b><span>jedlo</span></div>
      ${g.addActs ? `<i>+</i><div><b>${fk(burned)}</b><span>aktivita</span></div>` : ''}
      <i>=</i><div class="rem ${left < 0 ? 'over' : ''}"><b>${fk(left)}</b><span>${left < 0 ? 'nad cieľom' : 'zostáva'}</span></div>
    </div>
    <div class="macros">
      ${macro('p', 'Bielkoviny', 'sw-p')}
      ${macro('c', 'Sacharidy', 'sw-c')}

        <span>1 g B a S = 4 kcal, 1 g T = 9 kcal</span>

function renderWeek() {

  const goal = S.goals.kcal;
  const scale = Math.max(goal, ...vals.map(v => v.kcal)) * 1.18 || 1;
  const today = todayKey();
  const logged = vals.filter(v => v.kcal > 0);
  const avg = key => logged.length ? logged.reduce((a, v) => a + v[key], 0) / logged.length : 0;
  const cols = keys.map((k, i) => {
    const v = vals[i].kcal;
    const h = v / scale * 100;
    const cls = ['wc-col', k === S.date ? 'sel' : '', v > goal ? 'over' : ''].join(' ');
    const label = `${cap(dfLong.format(dateOf(k)))}: ${v ? fk(v) + ' kcal' : 'nič zapísané'}`;
    return `<button type="button" class="${cls}" data-act="go-day" data-date="${k}" aria-label="${esc(label)}" title="${esc(label)}">
      <span class="wc-bar" style="height:${h.toFixed(2)}%"></span>
      ${v ? `<span class="wc-val" style="bottom:${h.toFixed(2)}%">${fk(v)}</span>` : ''}

  }).join('');
  const days = keys.map(k => `<span class="${k === S.date ? 'sel' : ''} ${k === today ? 'today' : ''}">${dfShort.format(dateOf(k))}</span>`).join('');

    <div class="wc">
      <div class="wc-plot">
        <div class="wc-goal" style="bottom:${(goal / scale * 100).toFixed(2)}%"><span>cieľ ${fk(goal)}</span></div>
        ${cols}

      <div class="wc-days" aria-hidden="true">${days}</div>
    </div>
    <div class="week-stats">
      <div class="stat"><b>${logged.length ? fk(avg('kcal')) : '–'}</b><span>priemer kcal za zapísané dni</span></div>

    <p class="hint">Zapísané ${logged.length} zo 7 dní. Ťukni na stĺpec a prejdeš na daný deň.</p>`;
}

function itemSub(it) {
  if (!it.g) return `porcia · B ${fm(it.p)} · S ${fm(it.c)} · T ${fm(it.f)}`;
  const u = it.unit, n = u ? it.g / u.g : 0;
  const units = u && it.g >= u.g && Math.abs(n - Math.round(n * 2) / 2) < 0.01 ? ` (${fm(n)} ${esc(u.name)})` : '';
  return `${fk(it.g)} g${units} · B ${fm(it.p)} · S ${fm(it.c)} · T ${fm(it.f)}`;
}

    <div class="meal-actions"><button type="button" class="btn small" data-act="add-act" ${loading ? 'disabled' : ''}>+ Pridať aktivitu</button></div>

  </button>`;

function renderResults() {
  const box = $('#foodResults');
  if (!box) return;
  const raw = $('#foodSearch').value;
  const q = norm(raw.trim());
  UI.sheet.q = raw;
  UI.pick = new Map();
  const mine = S.foods.map(f => ({ ...f, custom: true }));
  if (!q) {
    const recent = recentFoods(8);
    let html = '';
    if (recent.length) html += `<div class="res-group"><h3>Naposledy</h3>${recent.map(foodRow).join('')}</div>`;
    if (mine.length) html += `<div class="res-group"><h3>Moje potraviny</h3>${mine.map(foodRow).join('')}</div>`;
    for (const [cat, name] of Object.entries(CATS)) {
      html += `<div class="res-group"><h3>${name}</h3>${FOODS.filter(f => f.cat === cat).map(foodRow).join('')}</div>`;
    }
    box.innerHTML = html;
    return;
  }
  const words = q.split(/\s+/);
  const scored = [];
  for (const f of [...mine, ...FOODS]) {
    const n = norm(f.name);
    if (!words.every(w => n.includes(w))) continue;
    const score = (n.startsWith(q) ? 0 : n.split(/[\s(,]+/).some(w => w.startsWith(words[0])) ? 1 : 2) - (f.custom ? 0.5 : 0);
    scored.push([score, n.length, f]);
  }
  if (!scored.length) {
    // Skúsime tvary slov („ryže“, „vajcia“) cez rovnaké porovnanie ako pri hlasovom zápise.
    for (const r of rankFoods(wordList(raw).map(stem)).slice(0, 12)) if (r.score >= 3.5) scored.push([3, 0, r.food]);
  }
  scored.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  box.innerHTML = scored.length
    ? `<div class="res-group">${scored.slice(0, 40).map(s => foodRow(s[2])).join('')}</div>`
    : `<p class="no-res">„${esc(raw.trim())}“ v databáze nie je. Pridaj ju cez <button type="button" class="linklike" data-act="tab" data-tab="custom">Nová potravina</button> alebo zapíš hodnoty cez <button type="button" class="linklike" data-act="tab" data-tab="quick">Rýchly zápis</button>.</p>`;
}

function qtyChips(food, g) {
  const opts = [];
  if (food.unit) for (const n of [1, 2, 3]) opts.push([food.unit.g * n, `${n} ${food.unit.name} · ${fk(food.unit.g * n)} g`]);
  for (const v of [50, 100, 150, 200]) if (!opts.some(o => o[0] === v)) opts.push([v, `${v} g`]);
  return `<div class="chips" style="margin-top:10px">${opts.map(([v, l]) =>
    `<button type="button" class="chip" data-act="qty" data-g="${v}" aria-pressed="${v === g}">${esc(l)}</button>`).join('')}</div>`;
}

function setMicStatus(html) { const el = $('#micStatus'); if (el) el.innerHTML = html; }

function syncMicButton() {
  const b = $('#micBtn');
  if (!b) return;
  b.classList.toggle('live', !!UI.rec);

}

function toggleMic() {
  if (!canMic()) { const ta = $('#voiceText'); ta.focus(); return; }
  if (UI.rec) { UI.rec.stop(); return; }
  const rec = new SpeechRec();
  rec.lang = 'sk-SK';
  rec.interimResults = true;
  rec.continuous = !/Android/i.test(navigator.userAgent);
  rec.maxAlternatives = 1;
  const ta = $('#voiceText');
  const base = ta.value.trim() ? ta.value.trim() + ', ' : '';
  let error = null;
  rec.onresult = e => {
    let text = '';
    for (let i = 0; i < e.results.length; i++) text += e.results[i][0].transcript;
    if (UI.sheet && UI.sheet.view === 'voice') { const el = $('#voiceText'); if (el) el.value = base + text.trim(); }
  };
  rec.onerror = e => { error = e.error; };
  rec.onend = () => {
    if (UI.rec !== rec) return;
    UI.rec = null;
    syncMicButton();
    const msgs = {
      'not-allowed': 'Prístup k mikrofónu je zakázaný. Povoľ ho v nastaveniach prehliadača alebo nadiktuj text klávesnicou.',
      'service-not-allowed': 'Prehliadač tu rozpoznávanie reči nepovolil. Nadiktuj text klávesnicou do poľa nižšie.',
      'no-speech': 'Nič som nepočul. Ťukni na mikrofón a hovor bližšie k telefónu.',
      'audio-capture': 'Nenašiel som mikrofón. Napíš text do poľa nižšie.',
      'network': 'Rozpoznávanie reči potrebuje internet. Skús to znova alebo text napíš.',
      'language-not-supported': 'Prehliadač nevie rozpoznávať slovenčinu. Nadiktuj text klávesnicou.',
    };
    if (error && error !== 'aborted') {
      if (['not-allowed', 'service-not-allowed', 'audio-capture', 'language-not-supported'].includes(error)) UI.micBlocked = true;
      setMicStatus(esc(msgs[error] || 'Rozpoznávanie reči zlyhalo. Skús to znova alebo text napíš.'));
      return;
    }
    const el = $('#voiceText');
    if (el && el.value.trim()) { setMicStatus('Hotovo. Skontroluj rozpoznané jedlá nižšie.'); runParse(); }
    else setMicStatus('Ťukni na mikrofón a povedz, čo si jedol.');
  };
  try {
    rec.start();
    UI.rec = rec;
    syncMicButton();
    setMicStatus('<b>Počúvam…</b> Keď dohovoríš, ťukni na mikrofón znova.');
  } catch (e) {
    UI.micBlocked = true;
    setMicStatus('Mikrofón sa nepodarilo spustiť. Nadiktuj text klávesnicou do poľa nižšie.');
  }
}

function stopListening(silent) {
  if (!UI.rec) return;
  const rec = UI.rec;
  UI.rec = null;
  try { silent ? rec.abort() : rec.stop(); } catch (e) { /* už skončilo */ }
  syncMicButton();
}

async function runParse() {
  const ta = $('#voiceText');
  if (!ta) return;
  const text = ta.value.trim();
  if (!text) { setMicStatus('Najprv povedz alebo napíš, čo si jedol.'); ta.focus(); return; }
  const meal = UI.sheet.meal;
  const note = $('#parseNote');
  if (UI.sample) {
    if (UI.aiBusy) UI.aiBusy.abort();
    const ctl = new AbortController();
    UI.aiBusy = ctl;
    $('#voiceResults').innerHTML = `<p class="hint"><span class="busy">Rozpoznávam jedlá…</span> <button type="button" class="linklike" data-act="ai-cancel">Zrušiť</button></p>`;
    $('#parseBtn').disabled = true;
    try {
      const res = await parseWithClaude(text, meal, ctl.signal);
      if (UI.aiBusy !== ctl) return;
      UI.voice = { text, ...res, source: 'ai' };
      if (note) note.textContent = 'Rozpoznal Claude. Skontroluj množstvá a hodnoty, potom ich pridaj.';
    } catch (e) {
      if (UI.aiBusy !== ctl) return;
      const code = e && e.code;
      if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) UI.sample = null;
      UI.voice = { text, ...parseLocal(text, meal), source: 'local' };
      if (note) note.textContent = code === 'cancelled' ? 'Rozpoznal som to priamo v aplikácii.'
        : code === 'rate_limited' ? 'Claude je teraz vyťažený, rozpoznal som to priamo v aplikácii.'
        : 'Claude nebol dostupný, rozpoznal som to priamo v aplikácii.';
    } finally {
      if (UI.aiBusy === ctl) UI.aiBusy = null;
      const b = $('#parseBtn');
      if (b) b.disabled = false;
    }
  } else {
    UI.voice = { text, ...parseLocal(text, meal), source: 'local' };
  }
  renderVoiceResults();
}

function renderVoiceResults() {
  const box = $('#voiceResults');
  if (!box) return;
  const v = UI.voice;
  if (!v) {
    box.innerHTML = `<h3>Skús napríklad</h3><div class="examples">${VOICE_EXAMPLES.map((x, i) =>
      `<button type="button" class="example" data-act="example" data-i="${i}">„${esc(x)}“</button>`).join('')}</div>`;
    return;
  }
  if (!v.items.length && !v.water && !v.unmatched.length) {
    box.innerHTML = `<p class="hint warn">V texte som nenašiel žiadne jedlo. Skús to povedať inak, napríklad „200 gramov ryže a kuracie prsia“.</p>`;
    return;
  }
  const rows = v.items.map((it, i) => {
    const t = fromPer(it.food, it.g || 0);
    const foodCtl = it.alts.length > 1
      ? `<select class="field" data-vi="${i}" data-k="food" aria-label="Potravina">${it.alts.map((f, j) =>
          `<option value="${j}" ${f === it.food ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}</select>`
      : `<div class="vr-name">${esc(it.food.name)}</div>`;
    return `<li class="vr ${it.on ? '' : 'off'}">
      <input type="checkbox" data-vi="${i}" data-k="on" ${it.on ? 'checked' : ''} aria-label="Pridať ${esc(it.food.name)}">
      <div class="vr-body">
        ${foodCtl}
        <div class="vr-sub">„${esc(it.text)}“${it.est ? ' · <span class="est">množstvo odhadnuté</span>' : ''}${it.food.ai ? ' · hodnoty odhadol Claude' : ''}</div>
        <div class="vr-ctrl">
          <div class="vr-g-wrap"><input class="field" inputmode="decimal" data-vi="${i}" data-k="g" value="${esc(fm(it.g))}" aria-label="Množstvo v gramoch"><span>g</span></div>
          <select class="field" data-vi="${i}" data-k="meal" aria-label="Jedlo dňa">${MEALS.map(m => `<option value="${m.id}" ${m.id === it.meal ? 'selected' : ''}>${m.name}</option>`).join('')}</select>
          <span class="vr-kcal" id="vrk-${i}">${fk(t.kcal)} kcal</span>
        </div>
      </div>
    </li>`;
  }).join('');
  const water = v.water ? `<li class="vr ${v.waterOn === false ? 'off' : ''}">
      <input type="checkbox" data-vi="water" data-k="on" ${v.waterOn === false ? '' : 'checked'} aria-label="Pridať vodu">
      <div class="vr-body"><div class="vr-name">Voda ${fk(v.water)} ml</div><div class="vr-sub">Pripočíta sa k pitnému režimu.</div></div>
    </li>` : '';
  const unmatched = v.unmatched.length ? `<div class="unmatched"><p>Toto som nerozpoznal:</p><ul>${v.unmatched.map((u, i) =>
      `<li><span>„${esc(u)}“</span><button type="button" class="btn small" data-act="voice-search" data-i="${i}">Hľadať</button></li>`).join('')}</ul></div>` : '';
  box.innerHTML = `<h3>Rozpoznané</h3><ul class="vr-list">${rows}${water}</ul>${unmatched}
    <div class="voice-total"><span id="voiceCount"></span><b id="voiceKcal"></b></div>
    <button type="button" class="btn primary block" id="voiceAdd" data-act="voice-add">Pridať do denníka</button>`;
  updateVoiceTotal();
}

function updateVoiceTotal() {
  const v = UI.voice;
  if (!v || !$('#voiceKcal')) return;
  const on = v.items.filter(it => it.on && it.g > 0);
  const kcal = on.reduce((a, it) => a + fromPer(it.food, it.g).kcal, 0);
  const n = on.length + (v.water && v.waterOn !== false ? 1 : 0);
  $('#voiceCount').textContent = `${n} ${plural(n, 'položka', 'položky', 'položiek')} vybraných`;
  $('#voiceKcal').textContent = `${fk(kcal)} kcal`;
  $('#voiceAdd').disabled = !n;
}

function addVoice() {
  const v = UI.voice;
  if (!v) return;
  const key = S.date;
  const items = v.items.filter(it => it.on && it.g > 0).map((it, i) => ({ ...itemFromFood(it.food, r1(it.g), it.meal), t: Date.now() + i }));
  const water = v.water && v.waterOn !== false ? v.water : 0;
  if (!items.length && !water) return;
  const day = ensureDay(key);
  day.items.push(...items);
  day.water = Math.min(20000, day.water + water);
  saveDay(key);
  closeSheet();
  render();
  const n = items.length;
  const parts = [];
  if (n) parts.push(`${n} ${plural(n, 'položka', 'položky', 'položiek')}`);
  if (water) parts.push(`${fk(water)} ml vody`);
  toast(`Pridané: ${parts.join(' a ')}`, {
    label: 'Späť', fn: () => {
      const d = ensureDay(key);
      const ids = items.map(x => x.id);
      d.items = d.items.filter(x => !ids.includes(x.id));
      d.water = Math.max(0, d.water - water);
      saveDay(key);
      render();
    },
  });
}

/* ---------- Toast ---------- */

let toastTimer = 0;
function toast(msg, action) {
  const el = $('#toast'), btn = $('#toastAct');
  $('#toastMsg').textContent = msg;
  btn.hidden = !action;
  btn.onclick = null;
  if (action) {
    btn.textContent = action.label;
    btn.onclick = () => { el.hidden = true; action.fn(); };
  }
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, action ? 6000 : 4000);
}

/* ---------- Akcie ---------- */

function setDate(key) {
  if (!isDayKey(key)) return;
  S.date = key;
  render();
}

function openAdd(meal) { openSheet({ view: 'add', meal: meal || defaultMeal(), tab: 'search', q: '' }); }

function openVoice(meal, from) {
  if (!UI.sheet || UI.sheet.view !== 'voice') UI.voice = null;
  openSheet({ view: 'voice', meal: meal || (UI.sheet && UI.sheet.meal) || defaultMeal(), from: from || null });
}

function openAmount(food, g, from) {
  const meal = UI.sheet && UI.sheet.meal ? UI.sheet.meal : defaultMeal();
  const grams = g || food.lastG || (food.unit ? food.unit.g : 100);
  openSheet({ view: 'amount', meal, food, g: grams, from: from || null });
}

function confirmAdd() {
  const st = UI.sheet, g = readG();
  if (!(g > 0) || g > 10000) { showErr('#amountErr', 'Zadaj množstvo v gramoch, napríklad 120.'); return; }
  const item = itemFromFood(st.food, r1(g), st.meal);
  const key = S.date;
  addItems(key, [item]);
  closeSheet();
  render();
  toast(`${MEAL_NAME[item.meal]}: ${item.name}, ${fk(item.g)} g`, { label: 'Späť', fn: () => { removeItems(key, [item.id]); render(); } });
}

function saveEdit() {
  const st = UI.sheet;
  const day = S.days[S.date];
  const it = day && day.items.find(x => x.id === st.itemId);
  if (!it) { closeSheet(); return; }
  if (it.per) {
    const g = readG();
    if (!(g > 0) || g > 10000) { showErr('#editErr', 'Zadaj množstvo v gramoch, napríklad 120.'); return; }
    Object.assign(it, { g: r1(g) }, fromPer(it.per, r1(g)));
  } else {
    const k = num($('#qKcal').value);
    if (!(k >= 0)) { showErr('#editErr', 'Zadaj energiu v kcal.'); return; }
    Object.assign(it, {
      name: $('#qName').value.trim() || 'Rýchly zápis', kcal: r1(k),
      p: r1(Math.max(0, num($('#qP').value) || 0)), c: r1(Math.max(0, num($('#qC').value) || 0)), f: r1(Math.max(0, num($('#qF').value) || 0)),
    });
  }
  it.meal = st.meal;
  saveDay(S.date);
  closeSheet();
  render();
  toast('Zmeny sú uložené.');
}

function deleteItem() {
  const key = S.date, id = UI.sheet.itemId;
  const [removed] = removeItems(key, [id]);
  closeSheet();
  render();
  if (removed) toast(`Odstránené: ${removed.name}`, { label: 'Späť', fn: () => { addItems(key, [removed]); render(); } });
}

function copyYesterday(meal) {
  const key = S.date;
  const src = dayItems(addDays(key, -1)).filter(it => it.meal === meal);
  if (!src.length) return;
  const now = Date.now();
  const copies = src.map((it, i) => ({ ...clone(it), id: uid(), t: now + i }));
  addItems(key, copies);
  render();
  const n = copies.length;
  toast(`${MEAL_NAME[meal]}: skopírované ${n} ${plural(n, 'položka', 'položky', 'položiek')}`, {
    label: 'Späť', fn: () => { removeItems(key, copies.map(c => c.id)); render(); },
  });
}

function submitCustom() {
  const name = $('#cfName').value.trim();
  const kcal = num($('#cfKcal').value);
  const vals = ['#cfP', '#cfC', '#cfF'].map(id => { const v = $(id).value.trim(); return v === '' ? 0 : num(v); });
  if (!name) return showErr('#cfErr', 'Doplň názov potraviny.');
  if (!(kcal >= 0) || kcal > 950) return showErr('#cfErr', 'Zadaj energiu na 100 g v kcal (0 až 950).');
  if (vals.some(v => !(v >= 0) || v > 100)) return showErr('#cfErr', 'Bielkoviny, sacharidy a tuky zadaj v gramoch na 100 g (0 až 100).');
  const unitName = $('#cfUnit').value.trim(), unitG = num($('#cfUnitG').value);
  if (unitName && !(unitG > 0)) return showErr('#cfErr', 'K porcii doplň aj jej hmotnosť v gramoch.');
  const food = { id: 'c_' + uid(), name, kcal: r1(kcal), p: r1(vals[0]), c: r1(vals[1]), f: r1(vals[2]), unit: unitName ? { name: unitName.slice(0, 30), g: r1(unitG) } : null, custom: true };
  S.foods.unshift(food);
  saveFoods();
  openAmount(food, null, 'custom');
}

function submitQuick() {
  const kcal = num($('#qKcal').value);
  if (!(kcal >= 0) || kcal > 10000) return showErr('#qErr', 'Zadaj energiu porcie v kcal.');
  const m = id => Math.max(0, num($(id).value) || 0);
  const st = UI.sheet;
  const item = { id: uid(), meal: st.meal, name: $('#qName').value.trim() || 'Rýchly zápis', g: null,
    kcal: r1(kcal), p: r1(m('#qP')), c: r1(m('#qC')), f: r1(m('#qF')), per: null, fid: null, unit: null, t: Date.now() };
  const key = S.date;
  addItems(key, [item]);
  closeSheet();
  render();
  toast(`${MEAL_NAME[item.meal]}: ${item.name}, ${fk(item.kcal)} kcal`, { label: 'Späť', fn: () => { removeItems(key, [item.id]); render(); } });
}

function submitAct() {
  const kind = $('#actKind').value, a = ACT_BY_ID.get(kind);
  const min = num($('#actMin').value), kcal = num($('#actKcal').value);
  const name = a ? a.name : $('#actName').value.trim();
  if (!name) return showErr('#actErr', 'Doplň názov aktivity.');
  if ($('#actMin').value.trim() && !(min > 0 && min <= 1440)) return showErr('#actErr', 'Trvanie zadaj v minútach, napríklad 60.');
  if (!(kcal >= 0 && kcal <= 10000)) return showErr('#actErr', 'Zadaj spálené kalórie, napríklad 350.');
  const key = S.date, day = ensureDay(key), st = UI.sheet;
  const data = { aid: a ? a.id : null, name, min: min > 0 ? min : null, kcal: Math.round(kcal) };
  if (st.actId) {
    const x = day.acts.find(y => y.id === st.actId);
    if (x) Object.assign(x, data);
  } else day.acts.push({ id: uid(), ...data, t: Date.now() });
  saveDay(key);
  closeSheet();
  render();
  toast(st.actId ? 'Zmeny sú uložené.' : `Aktivita: ${name}, ${fk(data.kcal)} kcal`);
}

function deleteAct() {
  const key = S.date, day = S.days[key], id = UI.sheet.actId;
  if (!day) return closeSheet();
  const i = day.acts.findIndex(x => x.id === id);
  const [removed] = i >= 0 ? day.acts.splice(i, 1) : [];
  saveDay(key);
  closeSheet();
  render();
  if (removed) toast(`Odstránené: ${removed.name}`, { label: 'Späť', fn: () => { ensureDay(key).acts.push(removed); saveDay(key); render(); } });
}

function submitGoals() {
  const k = num($('#gKcal').value), p = num($('#gP').value), c = num($('#gC').value), f = num($('#gF').value);
  const water = num($('#gWater').value), weight = num($('#gWeight').value);
  if (!(k >= 800 && k <= 10000)) return showErr('#goalErr', 'Cieľ energie zadaj v rozsahu 800 až 10 000 kcal.');
  if (![p, c, f].every(v => v > 0 && v <= 1500)) return showErr('#goalErr', 'Ciele makier zadaj v gramoch, každý väčší ako 0.');
  if (!(water >= 0.5 && water <= 8)) return showErr('#goalErr', 'Cieľ vody zadaj v litroch, napríklad 2,5.');
  if (!(weight >= 30 && weight <= 300)) return showErr('#goalErr', 'Hmotnosť zadaj v kilogramoch, napríklad 80.');
  S.goals = { kcal: Math.round(k), p: r1(p), c: r1(c), f: r1(f), water: Math.round(water * 1000), weight: r1(weight), addActs: $('#gAddActs').checked };
  saveGoals();
  closeSheet();
  render();
  toast('Ciele sú uložené.');
}

function deleteFood(fid) {
  const i = S.foods.findIndex(f => f.id === fid);
  if (i < 0) return;
  const [food] = S.foods.splice(i, 1);
  saveFoods();
  renderMyFoods();
  toast(`Odstránené z mojich potravín: ${food.name}`, { label: 'Späť', fn: () => { S.foods.splice(i, 0, food); saveFoods(); renderMyFoods(); } });
}

function exportJson() {
  return JSON.stringify({ app: 'dennik-potravin', version: 2, exported: new Date().toISOString(), goals: S.goals,
    foods: S.foods.map(({ custom, ...f }) => f), days: S.days }, null, 2);
}

async function doExport() {
  const data = exportJson();
  const filename = `dennik-potravin-${todayKey()}.json`;
  if (IN_CLAUDE) {
    const dl = await window.claude.use('downloads').catch(() => null);
    if (dl) {
      try { await dl.save({ filename, data }); toast('Záloha je pripravená.'); return; }
      catch (e) { if (e && (e.code === 'declined' || e.code === 'rate_limited')) return; }
    }
    showExportBox(data);
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    const a = Object.assign(document.createElement('a'), { href: url, download: filename });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch (e) { showExportBox(data); }
}

function showExportBox(data) {
  const box = $('#exportBox');
  if (!box) return;
  box.hidden = false;
  $('#exportText').value = data;
}

async function doImport(file) {
  let d;
  try { d = JSON.parse(await file.text()); } catch (e) { toast('Súbor sa nedá prečítať. Vyber zálohu vo formáte JSON z tejto aplikácie.'); return; }
  if (!d || typeof d !== 'object' || !d.days || typeof d.days !== 'object') { toast('V súbore nie sú záznamy z Denníka potravín.'); return; }
  const changed = [];
  let added = 0;
  for (const [k, v] of Object.entries(d.days)) {
    const inc = isDayKey(k) && cleanDay(v);
    if (!inc) continue;
    const day = ensureDay(k);
    const ids = new Set(day.items.map(it => it.id));
    const actIds = new Set(day.acts.map(a => a.id));
    const fresh = inc.items.filter(it => !ids.has(it.id));
    const freshActs = inc.acts.filter(a => !actIds.has(a.id));
    const water = Math.max(day.water, inc.water);
    if (!fresh.length && !freshActs.length && water === day.water) { if (isEmptyDay(day)) delete S.days[k]; continue; }
    day.items.push(...fresh);
    day.acts.push(...freshActs);
    day.water = water;
    added += fresh.length;
    changed.push(k);
  }
  let foodsChanged = false;
  if (Array.isArray(d.foods)) {
    const have = new Set(S.foods.map(f => f.id));
    for (const f of d.foods.map(cleanFood).filter(Boolean)) if (!have.has(f.id)) { S.foods.push(f); foodsChanged = true; }
  }
  if (d.goals) S.goals = normalizeGoals(d.goals);
  render();
  toast(`Importujem ${added} položiek…`);
  if (S.mode === 'cloud') {
    if (d.goals) await saveGoals();
    if (foodsChanged) await saveFoods();
    for (const k of changed) await saveDay(k);
  } else saveLocal();
  render();
  toast(`Import hotový: ${added} položiek v ${changed.length} dňoch.`);
}

/* ---------- Udalosti ---------- */

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const act = t.dataset.act;
  switch (act) {
    case 'prev-day': setDate(addDays(S.date, -1)); break;
    case 'next-day': setDate(addDays(S.date, 1)); break;
    case 'go-today': setDate(todayKey()); break;
    case 'go-day': setDate(t.dataset.date); break;
    case 'add': if (S.mode !== 'loading') openAdd(t.dataset.meal); break;
    case 'voice': if (S.mode !== 'loading') openVoice(t.dataset.meal, t.dataset.from); break;
    case 'add-act': openSheet({ view: 'act', actId: null }); break;
    case 'edit-act': openSheet({ view: 'act', actId: t.dataset.id, kcalTouched: true }); break;
    case 'delete-act': deleteAct(); break;
    case 'water': changeWater(S.date, +t.dataset.d); renderWater(); break;
    case 'glass': {
      const target = (+t.dataset.i + 1) * GLASS, w = dayWater(S.date);
      changeWater(S.date, (w === target ? target - GLASS : target) - w);
      renderWater();
      break;
    }
    case 'suggest': { const f = FOOD_BY_ID.get(t.dataset.fid); if (f) openAmount(f, +t.dataset.g); break; }
    case 'copy-yday': copyYesterday(t.dataset.meal); break;
    case 'edit-item': {
      const it = dayItems(S.date).find(x => x.id === t.dataset.id);
      if (it) openSheet({ view: 'edit', itemId: it.id, meal: it.meal });
      break;
    }
    case 'open-settings': openSheet({ view: 'settings' }); break;
    case 'close-sheet': closeSheet(); break;
    case 'set-meal': {
      UI.sheet.meal = t.dataset.meal;
      document.querySelectorAll('#sheet [data-act="set-meal"]').forEach(b => b.setAttribute('aria-checked', String(b === t)));
      const label = `Pridať: ${MEAL_NAME[UI.sheet.meal]}`;
      for (const id of ['#amountSubmit', '#quickSubmit']) { const b = $(id); if (b) b.textContent = label; }
      break;
    }
    case 'tab': UI.sheet.tab = t.dataset.tab; renderSheet(true); break;
    case 'pick-food': { const f = UI.pick.get(t.dataset.key); if (f) openAmount(f, null, 'add'); break; }
    case 'back': {
      const st = UI.sheet;
      if (st.view === 'add' && st.from === 'voice') openSheet({ view: 'voice', meal: st.meal, from: null });
      else if (st.view === 'voice' && st.from === 'add') openAdd(st.meal);
      else openSheet({ view: 'add', meal: st.meal, tab: 'search', q: '' });
      break;
    }
    case 'qty': { const el = $('#amountG'); if (el) { el.value = fm(+t.dataset.g); updatePreview(); } break; }
    case 'delete-item': deleteItem(); break;
    case 'del-food': deleteFood(t.dataset.fid); break;
    case 'mic': toggleMic(); break;
    case 'parse': stopListening(true); runParse(); break;
    case 'ai-cancel': if (UI.aiBusy) UI.aiBusy.abort(); break;
    case 'example': { const ta = $('#voiceText'); ta.value = VOICE_EXAMPLES[+t.dataset.i]; runParse(); break; }
    case 'voice-add': addVoice(); break;
    case 'voice-search': {
      const q = UI.voice && UI.voice.unmatched[+t.dataset.i];
      openSheet({ view: 'add', meal: UI.sheet.meal, tab: 'search', q: q || '', from: 'voice' });
      break;
    }
    case 'export': doExport(); break;
    case 'copy-export': {
      const ta = $('#exportText');
      const fallback = () => { ta.focus(); ta.select(); toast('Text je označený. Skopíruj ho.'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(() => toast('Záloha je skopírovaná.'), fallback);
      else fallback();
      break;
    }
  }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === 'amountForm') confirmAdd();
  else if (id === 'editForm') saveEdit();
  else if (id === 'customForm') submitCustom();
  else if (id === 'quickForm') submitQuick();
  else if (id === 'goalsForm') submitGoals();
  else if (id === 'actForm') submitAct();
});

function onVoiceField(el) {
  if (!UI.voice) return;
  const k = el.dataset.k;
  if (el.dataset.vi === 'water') { UI.voice.waterOn = el.checked; el.closest('.vr').classList.toggle('off', !el.checked); updateVoiceTotal(); return; }
  const it = UI.voice.items[+el.dataset.vi];
  if (!it) return;
  if (k === 'g') it.g = num(el.value);
  else if (k === 'on') { it.on = el.checked; el.closest('.vr').classList.toggle('off', !el.checked); }
  else if (k === 'meal') it.meal = el.value;
  else if (k === 'food') {
    const f = it.alts[+el.value];
    if (f && f !== it.food) {
      if (it.est && f.unit && it.food.unit && it.g === it.food.unit.g) it.g = f.unit.g;
      it.food = f;
      renderVoiceResults();
    }
    return;
  }
  const kc = $('#vrk-' + el.dataset.vi);
  if (kc) kc.textContent = `${fk(it.g > 0 ? fromPer(it.food, it.g).kcal : 0)} kcal`;
  updateVoiceTotal();
}

document.addEventListener('input', e => {
  const el = e.target, id = el.id;
  if (el.dataset && el.dataset.vi !== undefined) return onVoiceField(el);
  if (id === 'foodSearch') renderResults();
  else if (id === 'voiceText' && UI.voice) UI.voice.text = el.value;
  else if (id === 'amountG') { updatePreview(); showErr('#amountErr', ''); showErr('#editErr', ''); }
  else if (/^cf/.test(id)) { updateCustomCheck(); showErr('#cfErr', ''); }
  else if (/^g(Kcal|P|C|F)$/.test(id)) { updateGoalCheck(); showErr('#goalErr', ''); }
  else if (/^q/.test(id)) { showErr('#qErr', ''); showErr('#editErr', ''); }
  else if (id === 'actMin') { updateActPreview(); showErr('#actErr', ''); }
  else if (id === 'actKcal') { UI.sheet.kcalTouched = true; showErr('#actErr', ''); }
});

document.addEventListener('change', e => {
  const id = e.target.id;
  // Niektoré prehliadače pri zaškrtávacích políčkach a výberoch neposielajú „input“.
  if (e.target.dataset && e.target.dataset.vi !== undefined && (e.target.type === 'checkbox' || e.target.tagName === 'SELECT')) onVoiceField(e.target);
  if (id === 'datePick' && e.target.value) setDate(e.target.value);
  if (id === 'importFile' && e.target.files && e.target.files[0]) { doImport(e.target.files[0]); e.target.value = ''; }
  if (id === 'actKind') { UI.sheet.kcalTouched = false; updateActPreview(); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && UI.sheet) { e.preventDefault(); closeSheet(); }
  if (e.key === 'Enter' && e.target.id === 'foodSearch') {
    e.preventDefault();
    const first = document.querySelector('#foodResults [data-act="pick-food"]');
    if (first && $('#foodSearch').value.trim()) first.click();
  }
  if (e.key === 'Enter' && e.target.id === 'voiceText' && !e.shiftKey) { e.preventDefault(); runParse(); }
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const now = todayKey();
  if (now !== UI.today) { if (S.date === UI.today) S.date = now; UI.today = now; render(); }
});

/* ---------- Štart ---------- */

async function boot() {
  document.documentElement.lang = 'sk';
  render();
  if (IN_CLAUDE) {
    window.claude.use('sample').then(s => { UI.sample = s || null; }).catch(() => {});
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const id = user ? await user.id() : null;
      if (db && id) { startCloud(db, id); return; }
    } catch (e) { /* bez cloudu pokračujeme lokálne */ }
  }
  startLocal();
}
window.DennikParse = parseLocal;
boot();
})();
</script>
</body>
</html>
